[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k8co"
version = "0.1.4"
description = "Herramienta interactiva para cambiar de contextos en Kubernetes"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Drope", email = "pmendozauy@gmail.com" }
]
keywords = ["kubernetes", "kubectl", "cli"]


dependencies = [
    "simple-term-menu>=1.6.6",
    "argcomplete>=3.0.0"
]

[project.urls]
Homepage = "https://github.com"

[project.scripts]
k8co = "k8co.cli:main"
